name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iam_test
          POSTGRES_USER: iam_user
          POSTGRES_PASSWORD: iam_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iam_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw
      - name: Run backend unit + integration tests
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start full stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
      - name: Wait for backend health
        run: |
          echo "Waiting for backend service to become healthy..."
          READY=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health; then
              echo "Backend is healthy and reachable!"
              READY=true
              break
            fi
            echo "Waiting for backend ($i/60)..."
            sleep 2
          done
          if [ "$READY" = false ]; then
            echo "Backend failed to become healthy within timeout"
            docker compose -f docker-compose.yml -f docker-compose.test.yml logs
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run end-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps
          npx playwright test
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
